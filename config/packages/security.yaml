security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_in_memory:
            memory:
                users:
                    admin:
                        password: '$2y$13$hlylYTecX5gXogRfxBE1He379gmLY9dhfNyulx9cPPcFfbo6zMEXa'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/core-access-mel
            provider: admin_in_memory
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                default_target_path: /core-access-mel
                username_parameter: _username
                password_parameter: _password
            logout:
                path: app_admin_logout
                target: app_admin_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            lazy: true
            provider: admin_in_memory

    access_control:
        - { path: ^/core-access-mel/login, roles: PUBLIC_ACCESS }
        - { path: ^/core-access-mel, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
